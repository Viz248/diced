<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>diced</title>
<meta name="description" content="Personal cut tracker: calories, macros, and what a craving actually costs.">
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#10140f">
<link rel="icon" href="./icons/favicon.png">
<link rel="apple-touch-icon" href="./icons/icon-apple-touch.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="diced">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ============ TOKENS ============ */
/* Layout: sticky header (date + headline number) -> scroll body -> fixed bottom tab bar. Cards stack with gap, no nested shadows. */
:root{
  --bg:#f6f7f3; --surface:#ffffff; --surface-2:#eef0ea; --border:#dde1d7;
  --fg:#171b18; --fg-dim:#5b6358; --fg-faint:#8b9386;
  --accent:#2f9e52; --accent-fg:#ffffff; --accent-soft:#d9f0df;
  --warn:#9a6b06; --warn-soft:#f6e6bf;
  --danger:#c0392b; --danger-soft:#f7dcd6;
  --cheat:#7a4fc9; --cheat-soft:#e9ddf8;
  --font-body:'Manrope',system-ui,sans-serif; --font-mono:'JetBrains Mono',ui-monospace,monospace;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10140f; --surface:#171c15; --surface-2:#1e241b; --border:#2a3226;
    --fg:#edf1e9; --fg-dim:#a3ad9a; --fg-faint:#707a67;
    --accent:#5fd97a; --accent-fg:#0c1f10; --accent-soft:#1f3a26;
    --warn:#e3b64a; --warn-soft:#3a3016;
    --danger:#f0735f; --danger-soft:#3d231e;
    --cheat:#b89bf0; --cheat-soft:#2c2240;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#10140f; --surface:#171c15; --surface-2:#1e241b; --border:#2a3226;
  --fg:#edf1e9; --fg-dim:#a3ad9a; --fg-faint:#707a67;
  --accent:#5fd97a; --accent-fg:#0c1f10; --accent-soft:#1f3a26;
  --warn:#e3b64a; --warn-soft:#3a3016;
  --danger:#f0735f; --danger-soft:#3d231e;
  --cheat:#b89bf0; --cheat-soft:#2c2240;
  color-scheme: dark;
}
*{box-sizing:border-box;}
html,body{height:100%;}
img{max-width:100%;}
[hidden]{display:none!important;}
body{
  margin:0; background:var(--bg); color:var(--fg); font-family:var(--font-body);
  padding-left:max(16px, env(safe-area-inset-left,0px));
  padding-right:max(16px, env(safe-area-inset-right,0px));
  padding-bottom:0;
  -webkit-tap-highlight-color:transparent;
}
h1,h2,h3{margin:0; text-wrap:balance; font-family:var(--font-body);}
p{margin:0;}
button{font-family:inherit; cursor:pointer;}
input,select,textarea{font-family:inherit; color:var(--fg); background:var(--surface-2); border:1px solid var(--border); border-radius:10px;}
::-webkit-scrollbar{width:0;height:0;}

.app{max-width:560px; margin:0 auto; min-height:100%; display:flex; flex-direction:column;}

/* ---- header ---- */
.topbar::before{
  content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:30; background:var(--surface);
}
.topbar{
  position:sticky; top:env(safe-area-inset-top,0px); z-index:20; background:var(--surface);
  border-bottom:1px solid var(--border); padding:14px 0 12px; margin:0 0 14px;
}
.topbar-row{display:flex; align-items:baseline; justify-content:space-between; gap:10px;}
.topbar-date{font-size:13px; color:var(--fg-dim); font-weight:700; letter-spacing:.02em; text-transform:uppercase; white-space:nowrap;}
.topbar-mode{font-size:11px; color:var(--fg-faint); font-family:var(--font-mono);}
.theme-btn{background:none;border:none;color:var(--fg-dim);font-size:16px;padding:4px 6px;border-radius:8px;}
.daynav-btn{background:none; border:none; color:var(--fg-dim); font-size:19px; line-height:1; padding:4px 7px; border-radius:8px;}
.daynav-btn:disabled{opacity:.3;}
.daynav-btn:active:not(:disabled){background:var(--surface-2);}
.today-jump{font-size:11px; padding:4px 9px; margin-left:2px;}

/* ---- scroll body ---- */
.view{flex:1; padding-bottom:96px;}
.tabpanel{display:none;}
.tabpanel.active{display:block;}

/* ---- cards & primitives ---- */
.card{background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:16px; margin-bottom:12px;}
.card.flat{background:transparent; border:none; padding:0;}
.stack{display:flex; flex-direction:column; gap:10px;}
.row{display:flex; align-items:center; gap:10px; min-width:0;}
.row.between{justify-content:space-between;}
.grid3{display:grid; grid-template-columns:repeat(3,1fr); gap:10px;}
.grid2{display:grid; grid-template-columns:repeat(2,1fr); gap:10px;}
.label{font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--fg-faint);}
.sub{font-size:13px; color:var(--fg-dim);}
.hr{height:1px; background:var(--border); margin:4px 0;}

.num{font-family:var(--font-mono); font-variant-numeric:tabular-nums;}
.num-xl{font-family:var(--font-mono); font-variant-numeric:tabular-nums; font-size:44px; font-weight:700; line-height:1;}
.num-lg{font-family:var(--font-mono); font-variant-numeric:tabular-nums; font-size:22px; font-weight:700;}

.pill{display:inline-flex; align-items:center; gap:4px; font-size:11px; font-weight:700; padding:4px 9px; border-radius:999px; letter-spacing:.02em;}
.pill-accent{background:var(--accent-soft); color:var(--accent);}
.pill-warn{background:var(--warn-soft); color:var(--warn);}
.pill-danger{background:var(--danger-soft); color:var(--danger);}
.pill-cheat{background:var(--cheat-soft); color:var(--cheat);}
.pill-muted{background:var(--surface-2); color:var(--fg-dim);}

.bar-track{height:8px; border-radius:5px; background:var(--surface-2); overflow:hidden; position:relative;}
.bar-fill{height:100%; border-radius:5px; transition:width .25s ease;}
.bar-fill.accent{background:var(--accent);}
.bar-fill.warn{background:var(--warn);}
.bar-fill.danger{background:var(--danger);}

.btn{display:inline-flex; align-items:center; justify-content:center; gap:6px; border:1px solid var(--border); background:var(--surface-2); color:var(--fg); border-radius:10px; padding:10px 14px; font-size:14px; font-weight:700;}
.btn:active{transform:scale(.98);}
.btn-primary{background:var(--accent); color:var(--accent-fg); border-color:transparent;}
.btn-ghost{background:transparent; border-color:transparent; color:var(--fg-dim); font-weight:700;}
.btn-block{width:100%;}
.btn-sm{padding:7px 11px; font-size:12.5px; border-radius:8px;}
.btn-danger-outline{border-color:var(--danger); color:var(--danger); background:transparent;}

input[type=text],input[type=number],select{width:100%; padding:10px 12px; font-size:15px;}
input::placeholder{color:var(--fg-faint);}
.field{display:flex; flex-direction:column; gap:5px;}
.switch{position:relative; width:42px; height:25px; flex:none;}
.switch input{position:absolute; opacity:0; width:100%; height:100%; margin:0; cursor:pointer;}
.switch .track{position:absolute; inset:0; background:var(--surface-2); border:1px solid var(--border); border-radius:999px; transition:background .15s;}
.switch .knob{position:absolute; top:2px; left:2px; width:19px; height:19px; border-radius:50%; background:var(--fg-faint); transition:transform .15s, background .15s;}
.switch input:checked ~ .track{background:var(--accent-soft); border-color:var(--accent);}
.switch input:checked ~ .track ~ .knob{transform:translateX(17px); background:var(--accent);}

.empty{padding:22px 10px; text-align:center; color:var(--fg-faint); font-size:13.5px;}

/* ---- log rows ---- */
.logrow{display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--border);}
.logrow:last-child{border-bottom:none;}
.logrow .meta{flex:1; min-width:0;}
.logrow .name{font-weight:700; font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.logrow .sub2{font-size:12px; color:var(--fg-dim); font-family:var(--font-mono);}
.logrow .kcal{font-family:var(--font-mono); font-weight:700; font-size:14px; white-space:nowrap;}
.logrow .del{background:none; border:none; color:var(--fg-faint); font-size:17px; padding:4px 2px;}

/* ---- food picker list ---- */
.foodrow{display:flex; align-items:center; gap:10px; padding:11px 2px; border-bottom:1px solid var(--border); cursor:pointer;}
.foodrow:last-child{border-bottom:none;}
.foodrow .fname{font-weight:700; font-size:14.5px;}
.foodrow .fmeta{font-size:12px; color:var(--fg-dim); font-family:var(--font-mono);}
.foodrow .fkcal{font-family:var(--font-mono); font-weight:700; color:var(--fg-dim); font-size:13px;}
.star{background:none;border:none;font-size:16px;padding:2px 4px;color:var(--fg-faint);}
.star.on{color:var(--warn);}

/* ---- danger window banner ---- */
.banner{border-radius:16px; padding:16px; margin-bottom:12px; background:var(--cheat-soft); border:1px solid var(--cheat);}
.banner .btitle{font-weight:800; font-size:14.5px; color:var(--cheat); display:flex; align-items:center; gap:8px;}

/* ---- modal sheet ---- */
.sheet-overlay{position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:50; display:none;}
.sheet-overlay.open{display:block;}
.sheet{position:fixed; left:0; right:0; bottom:0; z-index:51; background:var(--surface); border-radius:20px 20px 0 0; max-height:86vh; overflow-y:auto; padding:18px max(16px,env(safe-area-inset-left,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px)); transform:translateY(100%); transition:transform .22s ease; box-shadow:0 -10px 30px rgba(0,0,0,.2);}
.sheet.open{transform:translateY(0);}
.sheet-handle{width:36px; height:4px; background:var(--border); border-radius:3px; margin:0 auto 14px;}
.sheet-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}

/* ---- tab bar ---- */
.tabbar{
  position:fixed; left:0; right:0; bottom:0; z-index:25; background:var(--surface); border-top:1px solid var(--border);
  padding:8px max(16px,env(safe-area-inset-left,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px));
  display:flex; justify-content:space-between; max-width:560px; margin:0 auto;
}
.tabbtn{flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; background:none; border:none; color:var(--fg-faint); font-size:10.5px; font-weight:700; padding:6px 2px; border-radius:10px; letter-spacing:.01em;}
.tabbtn .ic{font-size:18px; line-height:1;}
.tabbtn.active{color:var(--accent);}

.chart-wrap{width:100%; overflow-x:auto;}
.toast{position:fixed; bottom:calc(84px + env(safe-area-inset-bottom,0px)); left:50%; transform:translateX(-50%); background:var(--fg); color:var(--bg); padding:10px 16px; border-radius:999px; font-size:13px; font-weight:700; z-index:60; opacity:0; transition:opacity .2s, transform .2s; pointer-events:none;}
.toast.show{opacity:1;}

.segmented{display:flex; background:var(--surface-2); border:1px solid var(--border); border-radius:10px; padding:3px; gap:3px;}
.segmented button{flex:1; background:none; border:none; color:var(--fg-dim); font-size:12.5px; font-weight:700; padding:7px 4px; border-radius:7px;}
.segmented button.active{background:var(--surface); color:var(--fg); box-shadow:0 1px 2px rgba(0,0,0,.08);}

.macrorow{display:flex; align-items:center; gap:8px;}
.macrorow .mlabel{width:60px; font-size:12px; color:var(--fg-dim); font-weight:700;}
.macrorow .mnum{width:72px; text-align:right; font-family:var(--font-mono); font-size:12.5px; color:var(--fg-dim); flex:none;}

a{color:var(--accent);}
</style>
</head>
<body>

<div class="app">
  <div class="topbar">
    <div class="topbar-row">
      <div class="row" id="hdrDateWrap" style="gap:2px;"></div>
      <div class="row" style="gap:8px;">
        <span class="topbar-mode" id="hdrMode"></span>
        <button class="theme-btn" id="themeBtn" title="Toggle theme">◐</button>
      </div>
    </div>
  </div>

  <div class="view">
    <!-- TODAY -->
    <div class="tabpanel active" id="tab-today"></div>
    <!-- LIBRARY -->
    <div class="tabpanel" id="tab-library"></div>
    <!-- SHOULD-I -->
    <div class="tabpanel" id="tab-shouldi"></div>
    <!-- PLAN -->
    <div class="tabpanel" id="tab-plan"></div>
    <!-- TRENDS -->
    <div class="tabpanel" id="tab-trends"></div>
  </div>

  <div class="tabbar">
    <button class="tabbtn active" data-tab="today"><span class="ic">◉</span>Today</button>
    <button class="tabbtn" data-tab="library"><span class="ic">▤</span>Foods</button>
    <button class="tabbtn" data-tab="shouldi"><span class="ic">?</span>Should I?</button>
    <button class="tabbtn" data-tab="plan"><span class="ic">▱</span>Plan</button>
    <button class="tabbtn" data-tab="trends"><span class="ic">∿</span>Trends</button>
  </div>
</div>

<div class="sheet-overlay" id="overlay"></div>
<div class="sheet" id="sheet"><div class="sheet-handle"></div><div id="sheetBody"></div></div>
<div class="toast" id="toast"></div>
<input type="file" id="importFileInput" accept="application/json" hidden>

<script>
/* =========================================================================
   diced — personal cut tracker (standalone PWA build)
   Storage: IndexedDB, entirely on this device. No account, no network
   dependency once installed. See buildBackupPayload/exportBackup/importBackup
   for the portable-JSON safety net.
   ========================================================================= */

/* ---------------- constants ---------------- */
const KCAL_PER_KG = 7700;
const STEP_BASELINE = 10000;
const KCAL_PER_1000_STEPS = 40;

const MEALS = [
  {k:'breakfast', label:'Breakfast'},
  {k:'lunch', label:'Lunch'},
  {k:'snack', label:'Snack'},
  {k:'dinner', label:'Dinner'},
  {k:'other', label:'Other'},
];

/* ---------------- default settings ---------------- */
function defaultSettings(){
  return {
    heightCm:175, age:20, sex:'male',
    startWeightKg:75, goalWeightKg:73, startDate: todayStr(),
    calorieFloorKcal:1800, proteinMinG:140,
    estMaintenanceKcal:2650,
    simpleTargetKcal:2200, simpleDeficitKcal:450,
    mode:'simple', adaptiveTargetKcal:null, adaptiveMaintenanceKcal:null, adaptiveLastUpdated:null,
    cardioMultiplier:0.5,
    plan:{
      cornflakesOn:true,
      thursdayCap:true,
      tuesdayShawarmaCount:2,
      saturdayShawarmaCount:2,
      stepGoal:12500,
    },
    cheatSundayAnchor: mostRecentSunday(todayStr()), // this anchor Sunday IS a cheat sunday; alternates from there
    lastExportAt: null,
  };
}

/* ---------------- default food library ---------------- */
function defaultFoods(){
  const f = (name,category,kcal,protein,carbs,fat,servingLabel,extra={}) =>
    ({name,category,kcal,protein,carbs,fat,servingLabel,favorite:false,isCheat:false,...extra});
  return [
    f('Mess milk','Breakfast',150,8,11,8,'1 cup (~250ml)'),
    f('Cornflakes bowl','Breakfast',150,3,33,1,'1 bowl (~40g, dry)'),
    f('Chicken curry — light meat','Lunch/Dinner',170,21,3,8,'pieces only, no gravy'),
    f('Chicken curry — medium meat','Lunch/Dinner',230,29,4,11,'pieces only, no gravy'),
    f('Roti','Lunch/Dinner',110,3,18,3,'1 piece'),
    f('Masala chenna','Snack',150,9,20,4,'50g'),
    f('Kiwi + 2 carrots','Snack',95,2,20,1,'1 kiwi + 2 carrots'),
    f('Banana','Snack',105,1,27,0,'1 medium'),
    f('Whey + mess milk','Shake',205,28,10,4,'1 scoop + ~140ml milk'),
    f('Eggs — 2 whole + 4 whites','Protein',210,26,2,10,'boiled'),
    f('Dal + small rice','Dinner',320,11,55,6,'1 bowl dal + small scoop rice'),
    f('Chicken shawarma — Hart Lounge','Cheat',550,27,45,28,'1 piece', {isCheat:true}),
    f('Chicken burger — café','Cheat',500,22,40,26,'1 piece', {isCheat:true}),
    f('Tandoori chicken','Cheat',380,45,4,20,'good portion', {isCheat:true}),
    f('Bhatura','Cheat',280,6,35,13,'1 piece', {isCheat:true}),
    f('Chole','Cheat',230,9,30,8,'1 bowl', {isCheat:true}),
  ].map((x,i)=>({id:'seed_'+i, usageCount:0, ...x}));
}

/* ---------------- date helpers ---------------- */
function pad2(n){return String(n).padStart(2,'0');}
function dstr(d){return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());}
function todayStr(){return dstr(new Date());}
function parseD(s){const[y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d);}
function addDays(s,n){const d=parseD(s); d.setDate(d.getDate()+n); return dstr(d);}
function weekdayOf(s){return parseD(s).getDay();} // 0=Sun..6=Sat
const WD_NAMES=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
function mondayOf(s){const wd=weekdayOf(s); const diff=(wd===0?-6:1-wd); return addDays(s,diff);}
function mostRecentSunday(s){const wd=weekdayOf(s); return addDays(s,-wd);}
function fmtDateLong(s){const d=parseD(s); return d.toLocaleDateString(undefined,{weekday:'long',month:'short',day:'numeric'});}
function fmtDateShort(s){const d=parseD(s); return d.toLocaleDateString(undefined,{month:'short',day:'numeric'});}
function isCheatSundayWeek(dateStr, anchor){
  const anchorMon = mondayOf(anchor);
  const thisMon = mondayOf(dateStr);
  const weeks = Math.round((parseD(thisMon)-parseD(anchorMon))/(7*864e5));
  return (weeks % 2 === 0);
}
function isLunchCheatDay(dateStr, settings){
  const wd = weekdayOf(dateStr);
  if(wd===2 || wd===6) return true; // Tue, Sat
  if(wd===0) return isCheatSundayWeek(dateStr, settings.cheatSundayAnchor);
  return false;
}
function isThursday(dateStr){return weekdayOf(dateStr)===4;}

/* ---------------- app state ---------------- */
const state = {
  ready:false,
  settings: defaultSettings(),
  foods: [],
  logsByDate: {}, // date -> [log entries]
  days: {}, // date -> {date,steps,weightKg,waistCm,isCheatSunday}
  skips: [],
  activeTab:'today',
  todayDate: todayStr(),
  viewDate: todayStr(), // the date the Today tab is showing/editing — not always todayDate
};

/* ---------------- toast ---------------- */
let toastTimer=null;
function toast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg; el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>el.classList.remove('show'),1800);
}

/* ---------------- sheet (modal) ---------------- */
function openSheet(html){
  document.getElementById('sheetBody').innerHTML = html;
  document.getElementById('overlay').classList.add('open');
  document.getElementById('sheet').classList.add('open');
}
function closeSheet(){
  document.getElementById('overlay').classList.remove('open');
  document.getElementById('sheet').classList.remove('open');
}
document.getElementById('overlay').addEventListener('click', closeSheet);

/* ---------------- theme toggle (per-device convenience -> localStorage ok) ---------------- */
function initTheme(){
  let saved=null;
  try{ saved = localStorage.getItem('ledgercut_theme'); }catch(e){}
  if(saved==='light'||saved==='dark') document.documentElement.setAttribute('data-theme', saved);
  document.getElementById('themeBtn').addEventListener('click', ()=>{
    const cur = document.documentElement.getAttribute('data-theme');
    const next = cur==='dark' ? 'light' : (cur==='light' ? null : (matchMedia('(prefers-color-scheme: dark)').matches ? 'light':'dark'));
    if(next) document.documentElement.setAttribute('data-theme', next);
    else document.documentElement.removeAttribute('data-theme');
    try{ localStorage.setItem('ledgercut_theme', next || ''); }catch(e){}
  });
}

/* ---------------- tabs ---------------- */
function initTabs(){
  document.querySelectorAll('.tabbtn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      state.activeTab = btn.dataset.tab;
      document.querySelectorAll('.tabbtn').forEach(b=>b.classList.toggle('active', b===btn));
      document.querySelectorAll('.tabpanel').forEach(p=>p.classList.remove('active'));
      document.getElementById('tab-'+btn.dataset.tab).classList.add('active');
      renderAll();
    });
  });
}

/* =========================================================================
   NUTRITION ENGINE  (unchanged from the original — pure functions over state)
   ========================================================================= */
function computeTrailingStats(){
  const days = Object.keys(state.days).concat(Object.keys(state.logsByDate)).sort();
  if(days.length===0) return null;
  const end = todayStr();
  const start = addDays(end, -20);
  const dateList = [];
  for(let d=start; d<=end; d=addDays(d,1)) dateList.push(d);

  const dailyIntake = {};
  dateList.forEach(d=>{
    const logs = state.logsByDate[d]||[];
    let kcal=0;
    logs.forEach(l=>{ kcal += (l.type==='cardio' ? -Math.abs(l.kcal) : l.kcal); });
    dailyIntake[d] = logs.length ? kcal : null;
  });

  const weightPts = dateList
    .map(d=>({d, w: state.days[d]?.weightKg ?? null}))
    .filter(p=>p.w!=null);

  return {dateList, dailyIntake, weightPts};
}

function trailingAvg7Weight(dateStr){
  let sum=0,n=0;
  for(let i=0;i<7;i++){
    const d=addDays(dateStr,-i);
    const w=state.days[d]?.weightKg;
    if(w!=null){sum+=w;n++;}
  }
  return n? sum/n : null;
}

function latestWeight(){
  const dates = Object.keys(state.days).filter(d=>state.days[d].weightKg!=null).sort();
  if(!dates.length) return state.settings.startWeightKg;
  const last = dates[dates.length-1];
  return trailingAvg7Weight(last) ?? state.days[last].weightKg;
}

function maybeUpdateAdaptiveTarget(){
  const s = state.settings;
  const stats = computeTrailingStats();
  if(!stats) return;
  const WINDOW = 14;
  const end = todayStr();
  const start = addDays(end, -(WINDOW-1));
  let intakeDays = 0, intakeSum=0;
  for(let d=start; d<=end; d=addDays(d,1)){
    const v = stats.dailyIntake[d];
    if(v!=null){ intakeSum+=v; intakeDays++; }
  }
  const weightPtsInWindow = stats.weightPts.filter(p=>p.d>=start && p.d<=end);

  if(intakeDays < 8 || weightPtsInWindow.length < 5){
    return;
  }

  const avgIntake = intakeSum/intakeDays;
  const firstW = weightPtsInWindow[0].w;
  const lastW = weightPtsInWindow[weightPtsInWindow.length-1].w;
  const spanDays = Math.max(1, (parseD(weightPtsInWindow[weightPtsInWindow.length-1].d) - parseD(weightPtsInWindow[0].d)) / 864e5);
  const weightChangeKg = lastW - firstW;

  const maintenance = avgIntake - (weightChangeKg * KCAL_PER_KG / spanDays);
  let newTarget = maintenance - s.simpleDeficitKcal;
  newTarget = Math.max(s.calorieFloorKcal, Math.min(maintenance, newTarget));

  const prev = s.adaptiveTargetKcal;
  if(prev!=null){
    const delta = newTarget - prev;
    const clamped = Math.max(-150, Math.min(150, delta));
    newTarget = prev + clamped;
  }
  newTarget = Math.round(newTarget/10)*10;
  const newMaint = Math.round(maintenance/10)*10;

  const changed = s.mode!=='adaptive' || Math.abs((s.adaptiveTargetKcal||0)-newTarget) >= 10 || Math.abs((s.adaptiveMaintenanceKcal||0)-newMaint) >= 10;
  if(changed){
    s.mode='adaptive';
    s.adaptiveTargetKcal=newTarget;
    s.adaptiveMaintenanceKcal=newMaint;
    s.adaptiveLastUpdated=todayStr();
    saveSettings();
  }
}

function currentBaseTarget(){
  const s = state.settings;
  return s.mode==='adaptive' && s.adaptiveTargetKcal!=null ? s.adaptiveTargetKcal : s.simpleTargetKcal;
}
function currentMaintenance(){
  const s = state.settings;
  return s.mode==='adaptive' && s.adaptiveMaintenanceKcal!=null ? s.adaptiveMaintenanceKcal : s.estMaintenanceKcal;
}

function computeWeeklyPlan(){
  const s = state.settings;
  const base = currentBaseTarget();
  const p = s.plan;

  const tueExtra = p.tuesdayShawarmaCount>=2 ? 600 : 100;
  const satExtra = p.saturdayShawarmaCount>=2 ? 600 : 100;
  const sunExtra = 300;
  const thuExtra = p.thursdayCap ? 400 : 1000;
  const cornflakesWeekly = p.cornflakesOn ? 750 : 0;
  const stepBonusDaily = Math.max(0, (p.stepGoal - STEP_BASELINE)/1000*KCAL_PER_1000_STEPS);

  const plannedExtraWeekly = tueExtra + satExtra + sunExtra + thuExtra + cornflakesWeekly;
  const dailyBase = base - (plannedExtraWeekly/7) + stepBonusDaily;

  const weeklyBudget = dailyBase*7 + plannedExtraWeekly;
  const maintenance = currentMaintenance();
  const maintenanceWeekly = maintenance*7;
  const weeklyDeficit = maintenanceWeekly - weeklyBudget;
  const weeklyLossKg = weeklyDeficit / KCAL_PER_KG;

  return {dailyBase, tueExtra, satExtra, sunExtra, thuExtra, cornflakesWeekly, stepBonusDaily, weeklyBudget, weeklyDeficit, weeklyLossKg, maintenance, maintenanceWeekly};
}

function dayTargetFor(dateStr){
  const s = state.settings;
  const plan = computeWeeklyPlan();
  const wd = weekdayOf(dateStr);
  let extra = 0;
  if(wd===2) extra += plan.tueExtra;
  if(wd===6) extra += plan.satExtra;
  if(wd===0 && isCheatSundayWeek(dateStr, s.cheatSundayAnchor)) extra += plan.sunExtra*2;
  if(isThursday(dateStr)) extra += plan.thuExtra;

  const steps = state.days[dateStr]?.steps;
  const stepBonus = steps!=null ? Math.max(0,(steps-STEP_BASELINE)/1000*KCAL_PER_1000_STEPS) : plan.stepBonusDaily;

  return Math.round(plan.dailyBase - plan.stepBonusDaily + stepBonus + extra);
}

function projectedGoalDate(){
  const s = state.settings;
  const plan = computeWeeklyPlan();
  const weight = latestWeight();
  const kgToLose = weight - s.goalWeightKg;
  if(kgToLose<=0) return {date:todayStr(), reached:true, weeklyLossKg:plan.weeklyLossKg, weight};
  if(plan.weeklyLossKg<=0.01) return {date:null, reached:false, weeklyLossKg:plan.weeklyLossKg, weight};
  const weeks = kgToLose/plan.weeklyLossKg;
  const date = addDays(todayStr(), Math.round(weeks*7));
  return {date, reached:false, weeklyLossKg:plan.weeklyLossKg, weight, weeks};
}

function totalsFor(dateStr){
  const logs = state.logsByDate[dateStr]||[];
  const t = {kcal:0, protein:0, carbs:0, fat:0};
  logs.forEach(l=>{
    const sign = l.type==='cardio' ? -1 : 1;
    t.kcal += sign*Math.abs(l.kcal);
    if(sign>0){ t.protein+=l.protein||0; t.carbs+=l.carbs||0; t.fat+=l.fat||0; }
  });
  return t;
}

function weekTotals(dateStr){
  const mon = mondayOf(dateStr);
  let kcal=0;
  for(let i=0;i<7;i++){
    const d=addDays(mon,i);
    if(d>dateStr) break;
    kcal += totalsFor(d).kcal;
  }
  return kcal;
}

/* =========================================================================
   STORAGE — IndexedDB, device-local. One small promise wrapper; the rest of
   the app just calls the same save/add/delete functions as before.
   ========================================================================= */
const IDB_NAME = 'ledgercut';
const IDB_VERSION = 1;
let _dbPromise = null;

function openIDB(){
  if(_dbPromise) return _dbPromise;
  _dbPromise = new Promise((resolve, reject)=>{
    if(!('indexedDB' in window)){ reject(new Error('IndexedDB unavailable')); return; }
    const req = indexedDB.open(IDB_NAME, IDB_VERSION);
    req.onupgradeneeded = e=>{
      const db = e.target.result;
      if(!db.objectStoreNames.contains('settings')) db.createObjectStore('settings');
      if(!db.objectStoreNames.contains('foods')) db.createObjectStore('foods', {keyPath:'id'});
      if(!db.objectStoreNames.contains('logs')) db.createObjectStore('logs', {keyPath:'id'});
      if(!db.objectStoreNames.contains('days')) db.createObjectStore('days', {keyPath:'date'});
      if(!db.objectStoreNames.contains('skips')) db.createObjectStore('skips', {keyPath:'id'});
    };
    req.onsuccess = ()=>resolve(req.result);
    req.onerror = ()=>reject(req.error);
  });
  return _dbPromise;
}
async function idbGetAll(store){
  const db = await openIDB();
  return new Promise((resolve,reject)=>{
    const req = db.transaction(store,'readonly').objectStore(store).getAll();
    req.onsuccess=()=>resolve(req.result);
    req.onerror=()=>reject(req.error);
  });
}
async function idbGet(store,key){
  const db = await openIDB();
  return new Promise((resolve,reject)=>{
    const req = db.transaction(store,'readonly').objectStore(store).get(key);
    req.onsuccess=()=>resolve(req.result);
    req.onerror=()=>reject(req.error);
  });
}
async function idbPut(store,value,key){
  const db = await openIDB();
  return new Promise((resolve,reject)=>{
    const tx = db.transaction(store,'readwrite');
    const req = key!==undefined ? tx.objectStore(store).put(value,key) : tx.objectStore(store).put(value);
    req.onsuccess=()=>resolve();
    req.onerror=()=>reject(req.error);
  });
}
async function idbDelete(store,key){
  const db = await openIDB();
  return new Promise((resolve,reject)=>{
    const req = db.transaction(store,'readwrite').objectStore(store).delete(key);
    req.onsuccess=()=>resolve();
    req.onerror=()=>reject(req.error);
  });
}
async function idbClear(store){
  const db = await openIDB();
  return new Promise((resolve,reject)=>{
    const req = db.transaction(store,'readwrite').objectStore(store).clear();
    req.onsuccess=()=>resolve();
    req.onerror=()=>reject(req.error);
  });
}

async function initApp(){
  try{
    const [settingsRaw, foods, logs, days, skips] = await Promise.all([
      idbGet('settings','main'),
      idbGetAll('foods'),
      idbGetAll('logs'),
      idbGetAll('days'),
      idbGetAll('skips'),
    ]);

    if(settingsRaw){
      state.settings = {...defaultSettings(), ...settingsRaw, plan:{...defaultSettings().plan, ...(settingsRaw.plan||{})}};
    } else {
      state.settings = defaultSettings();
      await idbPut('settings', state.settings, 'main');
    }

    if(foods && foods.length){
      state.foods = foods;
    } else {
      state.foods = defaultFoods();
      await Promise.all(state.foods.map(f=>idbPut('foods', f)));
    }

    const byDate = {};
    (logs||[]).forEach(l=>{ (byDate[l.date] = byDate[l.date]||[]).push(l); });
    Object.values(byDate).forEach(arr=>arr.sort((a,b)=>(a.time||'').localeCompare(b.time||'')));
    state.logsByDate = byDate;

    const dmap = {};
    (days||[]).forEach(d=>{ dmap[d.date]=d; });
    state.days = dmap;

    state.skips = (skips||[]).sort((a,b)=>(b.time||'').localeCompare(a.time||''));

    state.ready = true;
    renderAll();
    maybeUpdateAdaptiveTarget();
  }catch(e){
    console.error('Local storage init failed', e);
    toast('Could not open local storage on this device/browser');
    state.foods = defaultFoods();
    state.ready = true;
    renderAll();
  }
}

function saveSettings(){
  idbPut('settings', state.settings, 'main').catch(e=>console.error(e));
}
function saveDay(dateStr, patch){
  state.days[dateStr] = {...(state.days[dateStr]||{date:dateStr}), ...patch, date:dateStr};
  idbPut('days', state.days[dateStr]).catch(e=>console.error(e));
  renderAll();
}
function addLog(entry){
  const id = 'l'+Date.now()+Math.random().toString(36).slice(2,7);
  const full = {id, date: state.viewDate, time: new Date().toISOString(), ...entry};
  if(!state.logsByDate[full.date]) state.logsByDate[full.date]=[];
  state.logsByDate[full.date].push(full);
  idbPut('logs', full).catch(e=>console.error(e));
  renderAll();
}
function deleteLog(dateStr, id){
  state.logsByDate[dateStr] = (state.logsByDate[dateStr]||[]).filter(l=>l.id!==id);
  idbDelete('logs', id).catch(e=>console.error(e));
  renderAll();
}
function addSkip(entry){
  const id='s'+Date.now()+Math.random().toString(36).slice(2,7);
  const full = {id, time:new Date().toISOString(), date:state.todayDate, ...entry};
  state.skips.unshift(full);
  idbPut('skips', full).catch(e=>console.error(e));
  renderAll();
}
function upsertFood(food){
  const id = food.id || ('f'+Date.now()+Math.random().toString(36).slice(2,7));
  const full = {...food, id};
  const idx = state.foods.findIndex(f=>f.id===id);
  if(idx>=0) state.foods[idx]=full; else state.foods.push(full);
  idbPut('foods', full).catch(e=>console.error(e));
  renderAll();
  return full;
}
function deleteFood(id){
  state.foods = state.foods.filter(f=>f.id!==id);
  idbDelete('foods', id).catch(e=>console.error(e));
  renderAll();
}
function toggleFavorite(id){
  const f = state.foods.find(x=>x.id===id);
  if(!f) return;
  f.favorite = !f.favorite;
  idbPut('foods', f).catch(e=>console.error(e));
  renderAll();
}
function bumpUsage(id){
  const f = state.foods.find(x=>x.id===id);
  if(!f) return;
  f.usageCount = (f.usageCount||0)+1;
  idbPut('foods', f).catch(()=>{});
}

/* =========================================================================
   BACKUP — export everything to a file on your device, and import one back.
   This is the real portability layer: plain JSON, no platform dependency,
   same shape whether it came from this build or the old claude.ai one.
   ========================================================================= */
function buildBackupPayload(){
  const allLogs = [];
  Object.values(state.logsByDate).forEach(arr=>arr.forEach(l=>allLogs.push(l)));
  const allDays = Object.keys(state.days).map(date=>({date, ...state.days[date]}));
  return {
    app:'diced', exportedAt:new Date().toISOString(), formatVersion:1,
    settings: state.settings,
    foods: state.foods,
    logs: allLogs.sort((a,b)=>(a.date+((a.time)||'')).localeCompare(b.date+((b.time)||''))),
    days: allDays.sort((a,b)=>a.date.localeCompare(b.date)),
    skips: state.skips,
  };
}
function exportBackup(){
  const payload = buildBackupPayload();
  const json = JSON.stringify(payload, null, 2);
  const blob = new Blob([json], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `diced-backup-${todayStr()}.json`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
  state.settings.lastExportAt = new Date().toISOString();
  saveSettings();
  toast('Backup saved to your downloads');
  backupNudgeDismissed = true;
  renderAll();
}
function daysSinceLastExport(){
  const t = state.settings.lastExportAt;
  if(!t) return Infinity;
  return (Date.now() - new Date(t).getTime())/86400000;
}
let backupNudgeDismissed = false;

function triggerImport(){
  document.getElementById('importFileInput').click();
}
async function handleImportFile(file){
  if(!file) return;
  let payload;
  try{
    const text = await file.text();
    payload = JSON.parse(text);
  }catch(e){
    toast('That file could not be read as a backup');
    return;
  }
  if(!payload || typeof payload!=='object' || !payload.settings || !Array.isArray(payload.foods)){
    toast("That doesn't look like a diced backup file");
    return;
  }
  const logCount = Array.isArray(payload.logs) ? payload.logs.length : 0;
  const ok = confirm(
    `Import this backup?\n\nFoods: ${payload.foods.length}\nLog entries: ${logCount}\nExported: ${payload.exportedAt ? new Date(payload.exportedAt).toLocaleString() : 'unknown'}\n\nThis REPLACES everything currently stored on this device.`
  );
  if(!ok) return;

  try{
    await Promise.all(['settings','foods','logs','days','skips'].map(s=>idbClear(s)));

    const newSettings = {...defaultSettings(), ...payload.settings, plan:{...defaultSettings().plan, ...(payload.settings.plan||{})}};
    await idbPut('settings', newSettings, 'main');

    await Promise.all((payload.foods||[]).map(f=>idbPut('foods', f)));
    await Promise.all((payload.logs||[]).map(l=>idbPut('logs', l)));
    await Promise.all((payload.days||[]).map(d=>idbPut('days', d)));
    await Promise.all((payload.skips||[]).map(sk=>idbPut('skips', sk)));

    toast('Backup imported');
    await initApp();
  }catch(e){
    console.error(e);
    toast('Import failed partway through — check the console');
  }
}

function dangerWindowInfo(dateStr){
  const wd = weekdayOf(dateStr);
  const windows = {3:{end:'10:50',label:'Wed'},4:{end:'11:50',label:'Thu'},5:{end:'11:50',label:'Fri'}};
  if(!windows[wd]) return null;
  const now = new Date();
  const nowMin = now.getHours()*60+now.getMinutes();
  const [eh,em] = windows[wd].end.split(':').map(Number);
  const endMin = eh*60+em;
  const lunchMin = 12*60+30;
  if(nowMin>=endMin && nowMin<lunchMin){
    return {active:true, untilMin:lunchMin-nowMin};
  }
  return {active:false};
}

function renderToday(){
  const d = state.viewDate;
  const isToday = d === state.todayDate;
  const s = state.settings;
  const totals = totalsFor(d);
  const target = dayTargetFor(d);
  const remaining = target - totals.kcal;
  const pct = Math.min(100, Math.max(0, (totals.kcal/target)*100));
  const barClass = totals.kcal>target ? 'danger' : (pct>85?'warn':'accent');

  const proteinPct = Math.min(100, (totals.protein/s.proteinMinG)*100);
  const cheatToday = isLunchCheatDay(d, s);
  const thuToday = isThursday(d);

  // the gap-window nudge is about where you are RIGHT NOW relative to class —
  // meaningless when browsing a past or future day
  const dw = isToday ? dangerWindowInfo(d) : null;
  let bannerHtml = '';
  if(dw && dw.active){
    bannerHtml = `
      <div class="banner">
        <div class="btitle">⚠ Gap window — ${dw.untilMin} min until mess opens</div>
        <p class="sub" style="margin-top:6px;">Tired now is when the bad call happens. Options already in your budget:</p>
        <div class="row" style="margin-top:10px; gap:8px;">
          <button class="btn btn-primary btn-sm" data-action="quickwalk">🚶 Go for a walk</button>
          <button class="btn btn-sm" data-action="quickshake">Log whey shake</button>
          <button class="btn btn-sm" data-action="gotoshouldi">Craving something else?</button>
        </div>
      </div>`;
  }

  let backupNudgeHtml = '';
  if(isToday && !backupNudgeDismissed && daysSinceLastExport()>=7){
    backupNudgeHtml = `
      <div class="banner" style="background:var(--surface-2); border-color:var(--border);">
        <div class="btitle" style="color:var(--fg);">💾 Back up your data</div>
        <p class="sub" style="margin-top:6px;">${state.settings.lastExportAt?"It's been a week since your last backup.":"You haven't backed up yet."} This device is the only copy — takes one tap.</p>
        <div class="row" style="margin-top:10px; gap:8px;">
          <button class="btn btn-primary btn-sm" data-action="exportbackup">Back up now</button>
          <button class="btn btn-ghost btn-sm" data-action="dismissbackup">Not now</button>
        </div>
      </div>`;
  }

  const logs = state.logsByDate[d]||[];
  const stepsVal = state.days[d]?.steps;
  const stepGoal = s.plan.stepGoal;
  const stepPct = stepsVal!=null ? Math.min(100,(stepsVal/stepGoal)*100) : 0;

  let sundayToggle = '';
  if(weekdayOf(d)===0){
    const override = state.days[d]?.isCheatSunday;
    const guess = isCheatSundayWeek(d, s.cheatSundayAnchor);
    const effective = override!=null ? override : guess;
    sundayToggle = `
      <div class="card">
        <div class="row between">
          <div>
            <div class="label">Cheat Sunday?</div>
            <div class="sub">Guessed: ${guess?'yes':'no'} (every other week)</div>
          </div>
          <label class="switch"><input type="checkbox" id="sundayCheatToggle" ${effective?'checked':''}><span class="track"></span><span class="knob"></span></label>
        </div>
      </div>`;
  }

  const mealGroups = MEALS.map(m=>{
    const items = logs.filter(l=>l.meal===m.k);
    if(!items.length) return '';
    const rows = items.map(l=>`
      <div class="logrow">
        <div class="meta">
          <div class="name">${esc(l.name)}${l.type==='cardio'?' 🏃':''}</div>
          <div class="sub2">${l.protein?Math.round(l.protein)+'p ':''}${l.carbs?Math.round(l.carbs)+'c ':''}${l.fat?Math.round(l.fat)+'f':''}</div>
        </div>
        <div class="kcal">${l.type==='cardio'?'-':''}${Math.round(Math.abs(l.kcal))}</div>
        <button class="del" data-action="dellog" data-id="${l.id}" data-date="${d}">✕</button>
      </div>`).join('');
    return `<div class="card"><div class="label" style="margin-bottom:6px;">${m.label}</div>${rows}</div>`;
  }).join('');

  document.getElementById('tab-today').innerHTML = `
    <div class="card" style="text-align:center;">
      <div class="label">Calories remaining</div>
      <div class="num-xl" style="color:${remaining<0?'var(--danger)':'var(--fg)'}">${Math.round(remaining)}</div>
      <div class="sub" style="margin:6px 0 10px;">of ${target} target${stepsVal!=null && stepsVal>STEP_BASELINE?' (steps bonus included)':''}</div>
      <div class="bar-track"><div class="bar-fill ${barClass}" style="width:${pct}%"></div></div>
      <div class="row between" style="margin-top:14px;">
        ${cheatToday ? '<span class="pill pill-cheat">Cheat day</span>' : '<span class="pill pill-muted">Normal day</span>'}
        ${thuToday ? '<span class="pill pill-cheat">Chole bhature</span>' : ''}
      </div>
    </div>

    <div class="card">
      <div class="row between" style="margin-bottom:10px;"><span class="label">Protein</span><span class="sub num">${Math.round(totals.protein)} / ${s.proteinMinG} g</span></div>
      <div class="bar-track"><div class="bar-fill ${proteinPct>=100?'accent':'warn'}" style="width:${proteinPct}%"></div></div>
      <div class="grid3" style="margin-top:12px;">
        <div><div class="label">Carbs</div><div class="num" style="font-weight:700;">${Math.round(totals.carbs)}g</div></div>

        <div><div class="label">Logged</div><div class="num" style="font-weight:700;">${Math.round(totals.kcal)} kcal</div></div>
      </div>
    </div>

    ${bannerHtml}

    <div class="card">
      <div class="row between">
        <div>
          <div class="label">Steps</div>
          <div class="sub">Goal ${stepGoal.toLocaleString()} · from Samsung Health</div>
        </div>
        <input type="number" inputmode="numeric" id="stepsInput" placeholder="0" value="${stepsVal??''}" style="width:90px; text-align:right;">
      </div>
      ${stepsVal!=null?`<div class="bar-track" style="margin-top:10px;"><div class="bar-fill accent" style="width:${stepPct}%"></div></div>`:''}
    </div>

    <div class="row" style="margin-bottom:12px; gap:10px;">
      <button class="btn btn-primary btn-block" data-action="opencadd">+ Add food</button>
      <button class="btn btn-block" data-action="openweigh">⚖ Weigh-in</button>
    </div>

    ${mealGroups || `<div class="empty">Nothing logged ${isToday?'yet today':'for this day'}. Tap "Add food" to ${isToday?'start':'add it in'}.</div>`}
  `;

  document.getElementById('stepsInput')?.addEventListener('change', e=>{
    const v = e.target.value===''?null:Number(e.target.value);
    saveDay(d, {steps:v});
  });
  document.getElementById('sundayCheatToggle')?.addEventListener('change', e=>{
    saveDay(d, {isCheatSunday:e.target.checked});
  });
}

/* ---- quick actions on Today ---- */
function wireTodayActions(){
  document.body.addEventListener('click', e=>{
    const el = e.target.closest('[data-action]');
    if(!el) return;
    const action = el.dataset.action;
    if(action==='opencadd') openAddFoodSheet();
    if(action==='openweigh') openWeighSheet();
    if(action==='prevday'){ state.viewDate = addDays(state.viewDate, -1); renderAll(); }
    if(action==='nextday'){ if(state.viewDate!==state.todayDate){ state.viewDate = addDays(state.viewDate, 1); renderAll(); } }
    if(action==='jumptoday'){ state.viewDate = state.todayDate; renderAll(); }
    if(action==='quickwalk'){ toast('Good call. No calories, no regrets.'); addSkip({name:'Took a walk instead of a gap snack', kcalSaved:0, proteinSaved:0, type:'walk'}); }
    if(action==='quickshake'){ const f=state.foods.find(x=>/whey/i.test(x.name)); if(f){ logFood(f, null, 'snack'); toast('Shake logged'); } }
    if(action==='gotoshouldi'){ document.querySelector('[data-tab=shouldi]').click(); }
    if(action==='dellog'){ deleteLog(el.dataset.date, el.dataset.id); }
    if(action==='closesheet') closeSheet();
    if(action==='delfood'){ if(confirm('Delete this food?')) deleteFood(el.dataset.id); }
    if(action==='fav'){ toggleFavorite(el.dataset.id); }
    if(action==='editfood'){ const f=state.foods.find(x=>x.id===el.dataset.id); if(f) openFoodEditSheetImpl(f); }
    if(action==='newfood'){ openFoodEditSheetImpl(null); }
    if(action==='newfoodfromsheet'){ openFoodEditSheetImpl(null); }
    if(action==='exportbackup'){ exportBackup(); }
    if(action==='dismissbackup'){ backupNudgeDismissed=true; renderAll(); }
    if(action==='importbackup'){ triggerImport(); }
  });
  document.getElementById('importFileInput').addEventListener('change', e=>{
    const file = e.target.files && e.target.files[0];
    handleImportFile(file);
    e.target.value = '';
  });
}

function logFood(food, variant, meal){
  const base = variant || food;
  bumpUsage(food.id);
  addLog({
    type:'food', foodId:food.id, name: variant ? food.name+' — '+variant.label : food.name,
    kcal: base.kcal, protein: base.protein, carbs: base.carbs, fat: base.fat,
    meal: meal || guessMeal(),
  });
}
function guessMeal(){
  const h = new Date().getHours();
  if(h<10) return 'breakfast';
  if(h<15) return 'lunch';
  if(h<19) return 'snack';
  return 'dinner';
}

function esc(s){ return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

    </div>
  `;

  document.getElementById('siCheckBtn').addEventListener('click', runShouldICheck);

function runShouldICheck(){
  const sel = document.getElementById('siFoodSelect').value;
  let name, kcal, protein=0;
  if(sel){
    const f = state.foods.find(x=>x.id===sel);
    name = f.name; kcal = f.variants?f.variants[Math.ceil(f.variants.length/2)-1].kcal:f.kcal; protein = f.variants?f.variants[0].protein:f.protein;
  } else {
    name = document.getElementById('siCustomName').value.trim() || 'this';
    kcal = Number(document.getElementById('siCustomKcal').value);
    if(!kcal){ toast('Enter a rough calorie count'); return; }
  }
  shouldIFood = {name, kcal, protein};

  const d = state.todayDate;
  const todayTotals = totalsFor(d);
  const todayTarget = dayTargetFor(d);
  const todayRemainSkip = todayTarget - todayTotals.kcal;
  const todayRemainEat = todayRemainSkip - kcal;

  const plan = computeWeeklyPlan();
  const weekSoFar = weekTotals(d);
  const weekRemainSkip = plan.weeklyBudget - weekSoFar;
  const weekRemainEat = weekRemainSkip - kcal;

  const dailyDeficitTarget = Math.max(1, plan.weeklyDeficit/7);
  const over = Math.max(0, -weekRemainEat);
  const shiftDays = over>0 ? Math.round((kcal/dailyDeficitTarget)*10)/10 : 0;

  const proj = projectedGoalDate();
  const shiftedDate = shiftDays>0 && proj.date ? addDays(proj.date, Math.ceil(shiftDays)) : proj.date;

  document.getElementById('siResult').innerHTML = `
    <div class="card">
      <h3 style="margin-bottom:12px;">${esc(name)} — ${kcal} kcal</h3>
      <table style="width:100%; border-collapse:collapse; font-size:13.5px;">
        <tr><td class="sub" style="padding:6px 0;"></td><td class="label" style="text-align:right; padding:6px 0;">Skip it</td><td class="label" style="text-align:right; padding:6px 0; color:var(--danger);">Eat it</td></tr>
        <tr style="border-top:1px solid var(--border);"><td style="padding:8px 0;">Today left</td><td class="num" style="text-align:right;">${Math.round(todayRemainSkip)}</td><td class="num" style="text-align:right; color:${todayRemainEat<0?'var(--danger)':'var(--fg)'}">${Math.round(todayRemainEat)}</td></tr>
        <tr style="border-top:1px solid var(--border);"><td style="padding:8px 0;">Week left</td><td class="num" style="text-align:right;">${Math.round(weekRemainSkip)}</td><td class="num" style="text-align:right; color:${weekRemainEat<0?'var(--danger)':'var(--fg)'}">${Math.round(weekRemainEat)}</td></tr>
        <tr style="border-top:1px solid var(--border);"><td style="padding:8px 0;">Goal date</td><td class="num" style="text-align:right;">${proj.date?fmtDateShort(proj.date):'—'}</td><td class="num" style="text-align:right; color:${shiftDays>0?'var(--danger)':'var(--fg)'}">${shiftedDate?fmtDateShort(shiftedDate):'—'}</td></tr>
      </table>
      ${shiftDays>0?`<p class="sub" style="margin-top:12px;">Eating this unplanned pushes your goal back about <b style="color:var(--danger);">${shiftDays} day${shiftDays!==1?'s':''}</b>.</p>`:`<p class="sub" style="margin-top:12px;">This fits inside your remaining budget — no real cost either way.</p>`}
      <div class="row" style="margin-top:14px; gap:8px;">
        <button class="btn btn-primary" style="flex:1;" id="siSkipBtn">Skip it — log the win</button>
        <button class="btn" style="flex:1;" id="siEatBtn">Log it anyway</button>
      </div>
    </div>
  `;
  document.getElementById('siSkipBtn').addEventListener('click', ()=>{
    addSkip({name, kcalSaved:kcal, proteinSaved:protein});
    toast('Nice. Logged as a win, not as food.');
    document.getElementById('siResult').innerHTML='';
  });
  document.getElementById('siEatBtn').addEventListener('click', ()=>{
    addLog({type:'food', name, kcal, protein, carbs:0, fat:0, meal:guessMeal()});
    toast("Logged. No judgment, now it's accounted for.");
    document.getElementById('siResult').innerHTML='';
  });
}

function lineChartSvg(points, opts={}){
  const w=320,h=140,pad=28;
  if(points.length<2) return `<div class="empty">Not enough data yet — log a few more weigh-ins.</div>`;
  const ys = points.map(p=>p.v);
  const minY = Math.min(...ys), maxY = Math.max(...ys);
  const spanY = (maxY-minY)||1;
  const x = i => pad + (i/(points.length-1))*(w-2*pad);
  const y = v => (h-pad) - ((v-minY)/spanY)*(h-2*pad);
  const path = points.map((p,i)=>`${i===0?'M':'L'} ${x(i).toFixed(1)} ${y(p.v).toFixed(1)}`).join(' ');
  const areaPath = path + ` L ${x(points.length-1).toFixed(1)} ${h-pad} L ${x(0).toFixed(1)} ${h-pad} Z`;
  const last = points[points.length-1];
  return `
    <svg viewBox="0 0 ${w} ${h}" style="width:100%; height:${h}px;">
      <path d="${areaPath}" fill="var(--accent)" opacity="0.12"></path>
      <path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"></path>
      <circle cx="${x(points.length-1)}" cy="${y(last.v)}" r="3.5" fill="var(--accent)"></circle>
      <text x="${x(points.length-1)}" y="${y(last.v)-10}" text-anchor="end" font-size="11" font-family="monospace" fill="var(--fg)" font-weight="700">${last.v.toFixed(1)}${opts.unit||''}</text>
      <text x="${pad}" y="${h-6}" font-size="9" fill="var(--fg-faint)">${points[0].label}</text>
      <text x="${w-pad}" y="${h-6}" text-anchor="end" font-size="9" fill="var(--fg-faint)">${last.label}</text>
    </svg>`;
}

function barChartSvg(bars){
  const w=320,h=140,pad=24,barW=(w-2*pad)/bars.length*0.6, gap=(w-2*pad)/bars.length;
  const maxV = Math.max(...bars.map(b=>Math.max(b.actual,b.budget)), 1);
  const x0 = i => pad + i*gap + (gap-barW)/2;
  const y = v => (h-pad) - (v/maxV)*(h-2*pad-14);
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%; height:${h}px;">
    ${bars.map((b,i)=>{
      const bx = x0(i);
      const by = y(b.actual);
      const bh = (h-pad)-by;
      const color = b.actual>b.budget ? 'var(--danger)' : 'var(--accent)';
      const budgetY = y(b.budget);
      return `
        <line x1="${bx-2}" x2="${bx+barW+2}" y1="${budgetY}" y2="${budgetY}" stroke="var(--fg-faint)" stroke-width="1.5" stroke-dasharray="3,2"></line>
        <rect x="${bx}" y="${by}" width="${barW}" height="${bh}" rx="3" fill="${color}" opacity="0.85"></rect>
        <text x="${bx+barW/2}" y="${h-6}" text-anchor="middle" font-size="9" fill="var(--fg-faint)">${b.label}</text>
      `;
    }).join('')}
  </svg>`;
}

function renderTrends(){
  const weightDates = Object.keys(state.days).filter(d=>state.days[d].weightKg!=null).sort();
  const avgPoints = weightDates.map(d=>({v: trailingAvg7Weight(d) ?? state.days[d].weightKg, label: fmtDateShort(d)}));

  const waistDates = Object.keys(state.days).filter(d=>state.days[d].waistCm!=null).sort();
  const waistPoints = waistDates.map(d=>({v: state.days[d].waistCm, label: fmtDateShort(d)}));

  const plan = computeWeeklyPlan();
  const weeks = [];
  let wkStart = mondayOf(todayStr());
  for(let i=5;i>=0;i--){
    const start = addDays(wkStart, -7*i);
    let sum=0;
    for(let j=0;j<7;j++){ sum += totalsFor(addDays(start,j)).kcal; }
    weeks.push({label: fmtDateShort(start).split(' ')[1]||fmtDateShort(start), actual: sum, budget: plan.weeklyBudget});
  }

  const latest = latestWeight();
  const lost = state.settings.startWeightKg - latest;

  document.getElementById('tab-trends').innerHTML = `
    <h2 style="margin-bottom:14px;">Trends</h2>

    <div class="card">
      <div class="row between" style="margin-bottom:10px;">
        <div class="label">Weight (7-day avg)</div>
        <div class="num" style="font-weight:700;">${latest?latest.toFixed(1)+' kg':'—'}</div>
      </div>
      <div class="chart-wrap">${lineChartSvg(avgPoints,{unit:'kg'})}</div>
      <div class="row between" style="margin-top:10px;">
        <span class="sub">Since start</span>
        <span class="num" style="font-weight:700; color:${lost>0?'var(--accent)':'var(--fg-dim)'}">${lost>0?'−':''}${Math.abs(lost).toFixed(1)} kg</span>
      </div>
    </div>

    <div class="card">
      <div class="label" style="margin-bottom:10px;">Waist (cm)</div>
      <div class="chart-wrap">${lineChartSvg(waistPoints,{unit:'cm'})}</div>
    </div>

    <div class="card">
      <div class="label" style="margin-bottom:10px;">Weekly calories vs budget</div>
      <div class="chart-wrap">${barChartSvg(weeks)}</div>
      <p class="sub" style="margin-top:8px;">Dashed line = your weekly budget. Red bar = over for that week.</p>
    </div>

    <div class="card">
      <div class="row between"><span class="label">Logging streak check</span></div>
      <p class="sub" style="margin-top:6px;">${loggingStreakText()}</p>
    </div>
  `;
}

function loggingStreakText(){
  let streak=0;
  for(let i=0;i<30;i++){
    const d = addDays(todayStr(),-i);
    if((state.logsByDate[d]||[]).length>0) streak++;
    else break;
  }
  if(streak===0) return 'Nothing logged today yet.';
  return `${streak} day${streak!==1?'s':''} logged in a row. Keep it going — the adaptive target needs consistent data to learn your real maintenance.`;
}

/* =========================================================================
   RENDER ALL
   ========================================================================= */
function renderAll(){
  if(!state.ready) return;
  const viewingToday = state.viewDate === state.todayDate;
  document.getElementById('hdrDateWrap').innerHTML = `
    <button class="daynav-btn" data-action="prevday" aria-label="Previous day">‹</button>
    <div class="topbar-date">${fmtDateLong(state.viewDate)}</div>
    <button class="daynav-btn" data-action="nextday" ${viewingToday?'disabled':''} aria-label="Next day">›</button>
    ${!viewingToday?'<button class="btn btn-ghost today-jump" data-action="jumptoday">Today</button>':''}
  `;
  document.getElementById('hdrMode').textContent = state.settings.mode==='adaptive' ? 'adaptive' : 'simple';
  if(state.activeTab==='today') renderToday();
  if(state.activeTab==='library') renderLibrary();
  if(state.activeTab==='shouldi') renderShouldI();
  if(state.activeTab==='plan') renderPlan();
  if(state.activeTab==='trends') renderTrends();
}

/* =========================================================================
   BOOT
   ========================================================================= */
initTheme();
initTabs();
wireTodayActions();
initApp();
setInterval(()=>{
  const t = todayStr();
  if(t !== state.todayDate){
    const wasViewingToday = state.viewDate === state.todayDate;
    state.todayDate = t;
    if(wasViewingToday) state.viewDate = t; // follow along if they were on "today"; leave it if they're browsing history
    renderAll();
  }
}, 60000);

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('./sw.js').catch(e=>console.error('SW register failed', e));
  });
}
</script>
